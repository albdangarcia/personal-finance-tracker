name: React Tests with Jest and RTL

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    # Provide dummy database URLs so `prisma generate` doesn't crash during `npm install`
    env:
      POSTGRES_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Upgraded to 22 to fix the EBADENGINE warnings
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # npm ci is cleaner and faster for CI environments

      - name: Run tests
        run: npm test -- --watchAll=false